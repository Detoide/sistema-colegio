spring.application.name=sistema-matricula
server.port=${SERVER_PORT:8080}

# Base de datos existente (docs/schema.sql)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/colegio_db}
spring.datasource.username=${DB_USER:usr_admin}
spring.datasource.password=${DB_PASSWORD:Test123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

server.servlet.session.timeout=30m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false

# Seguridad
app.security.migrar-passwords=${MIGRAR_PASSWORDS:true}

# Reglas de alertas
app.alertas.umbral-nota=${UMBRAL_NOTA:11}
app.alertas.faltas-para-alerta=${FALTAS_ALERTA:3}
